name: Publish package

# Publishes the Studio frontend as a scoped npm package to GitHub Packages, INCLUDING
# the app's own Go bridge binaries (dictation-go + wezterm-bridge) that the Electron
# app sits on top of. After `npm install -g @talkersoft-com/agent-arcade-studio` you
# get a global `agent-arcade` command.
#
# Triggered when you publish a GitHub Release; the release tag must match the version
# in package.json or the run fails. Also runnable manually (workflow_dispatch).
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write # GITHUB_TOKEN needs this to push to GitHub Packages

jobs:
  publish:
    # macOS runner: the Go bridges build with CGO and are ad-hoc codesigned, so the
    # binaries shipped in the package are macOS/arm64 (the Electron app is macOS-only).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@talkersoft-com"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      # Gate: package.json version MUST equal the release tag (minus any leading "v").
      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag version:  $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Bump package.json to match the tag, then re-release."
            exit 1
          fi

      # This new source location builds the Studio (React) + Arcade (XState) bundles with
      # esbuild via `npm run build` (the build:js stage), so CI must install deps first.
      # The old repo shipped raw committed JS and needed no install — this `npm ci` is the
      # ONLY addition to the otherwise byte-identical publish workflow.
      - name: Install dependencies
        run: npm ci

      # Build the JS bundles (build:js) + the app's Go bridges. These are gitignored build
      # artifacts, included in the package via package.json "files" (overrides .gitignore).
      - name: Build bundles + Go bridges (build:js + dictation-go + wezterm-bridge)
        run: npm run build

      - name: Verify the Go binaries are present
        run: |
          test -x go/bin/dictation-go || { echo "::error::go/bin/dictation-go missing"; exit 1; }
          test -x wezterm-bridge/bin/wezterm-bridge || { echo "::error::wezterm-bridge/bin/wezterm-bridge missing"; exit 1; }
          echo "✓ Go binaries built and present"

      # Bundle the official, notarized, universal WezTerm.app so a fresh
      # `npm i -g` drives WezTerm with nothing else installed. We download a PINNED
      # release of wez/wezterm (MIT, © Wez Furlong — credited in Settings → General),
      # verify its published SHA-256, and unpack WezTerm.app into vendor/wezterm/.
      # Nothing is committed to git: vendor/wezterm/ is gitignored and packed into the
      # tarball via package.json "files" (same pattern as the Go bridges). Bump
      # WEZTERM_TAG to upgrade — the build is deterministic for a given tag.
      # Same script dev runs (package.json "vendor:wezterm"), so CI and local
      # launches drive the identical pinned WezTerm. Bump the tag in the script.
      - name: Bundle WezTerm (official release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-wezterm.sh

      # Sanity: list exactly what will be published (should include go/bin + bin/).
      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

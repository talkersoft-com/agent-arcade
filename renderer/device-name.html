<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Name this device</title>
<style>
  :root{
    --bg:#0e131a;--surface:#161d27;--ink:#e7ecf3;--muted:#98a4b4;--faint:#6b7787;
    --border:#2a323e;--accent:#2dd4bf;--accent-ink:#052b27;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){:root{
    --bg:#f5f7fa;--surface:#fff;--ink:#18212f;--muted:#5a6676;--faint:#8b96a5;
    --border:#dfe4ec;--accent:#0d9488;--accent-ink:#fff;
  }}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;
       -webkit-font-smoothing:antialiased;user-select:none;-webkit-app-region:drag}
  .card{width:400px;max-width:92vw;text-align:center;padding:8px 22px 24px;-webkit-app-region:no-drag}
  .icon{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;display:grid;place-items:center;
        background:var(--surface);border:1px solid var(--border);color:var(--ink)}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.5}
  input{width:100%;font:inherit;font-size:16px;font-weight:600;text-align:center;color:var(--ink);
        background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px 12px}
  input:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--faint);margin:9px 0 18px;min-height:16px}
  button{font:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:11px;padding:12px 16px;
         width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">
      <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26" id="glyph"></svg>
    </div>
    <h1>Name this device</h1>
    <p class="sub">Give this machine a name you’ll recognize. It’s how you’ll pick it out later when you have more than one.</p>
    <input id="name" type="text" maxlength="60" placeholder="Work MacBook" autocomplete="off" spellcheck="false" />
    <div class="hint" id="hint"></div>
    <button id="save">Save</button>
  </div>
<script>
  const GLYPHS = {
    macos: "M16.7 12.8c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.7-.4 6.6 1.1 8.8.7 1.1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.2 0 1.9-1.1 2.6-2.1.8-1.2 1.1-2.4 1.2-2.4 0 0-2.2-.9-2.2-3.5zM14.6 5.9c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2z",
    windows: "M3 5.5l7.2-1v7.1H3V5.5zm0 13l7.2 1v-7h-7.2v6zM11.4 4.3L21 3v8.6h-9.6V4.3zm0 8.5H21V21l-9.6-1.3v-6.9z",
    linux: "M12 2c-2.2 0-3.6 1.8-3.6 4.2 0 1.6.3 2.3-.4 3.4-1 1.5-2.6 3.4-2.6 6 0 1 .3 1.8.8 2.4-.3.7-.2 1.5.3 1.9.6.5 1.6.4 2.4-.2.9.5 2 .8 3.1.8s2.2-.3 3.1-.8c.8.6 1.8.7 2.4.2.5-.4.6-1.2.3-1.9.5-.6.8-1.4.8-2.4 0-2.6-1.6-4.5-2.6-6-.7-1.1-.4-1.8-.4-3.4C15.6 3.8 14.2 2 12 2z",
  };
  const $ = (id) => document.getElementById(id);
  const input = $("name"), btn = $("save"), hint = $("hint");

  (async () => {
    const info = await window.tester.deviceNameSuggest();     // {suggested, platform}
    $("glyph").innerHTML = '<path d="' + (GLYPHS[info.platform] || GLYPHS.linux) + '"/>';
    input.value = info.suggested || "";
    input.focus();
    input.select();
  })();

  async function save() {
    const name = input.value.trim();
    if (!name) { hint.textContent = "Give it a name to continue."; input.focus(); return; }
    btn.disabled = true; hint.textContent = "Saving…";
    await window.tester.deviceNameSave(name);
  }
  btn.addEventListener("click", save);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });
</script>
</body>
</html>

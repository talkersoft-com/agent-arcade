<!DOCTYPE html>
<!-- Custom About window. Replaces the native macOS About panel so we control the
     whole surface: one cohesive lighter panel (no darker, scrollable credits box),
     our Saturn icon, and a padded gap between the version and the credits. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <style>
      :root {
        --panel: #2c2f36;      /* lighter than the native credits box */
        --ink: #e8eaed;
        --muted: #aab0ba;
        --accent: #6ea8e6;
      }
      @media (prefers-color-scheme: light) {
        :root { --panel: #fbfbfc; --ink: #1d2128; --muted: #5b626d; --accent: #2b6cb0; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--panel); color: var(--ink);
        -webkit-user-select: none; user-select: none; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        padding: 26px 30px 18px;
      }
      .icon { width: 84px; height: 84px; border-radius: 18px; }
      .name { font-size: 19px; font-weight: 700; margin-top: 14px; }
      .ver { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

      /* The padded gap between the version and the credits the user asked for. */
      .credits {
        width: 100%; margin-top: 26px; line-height: 1.5; font-size: 12.5px;
      }
      .sect { margin-bottom: 12px; }
      .sect:last-child { margin-bottom: 0; }
      .label { font-weight: 600; color: var(--ink); }
      .detail { color: var(--muted); padding-left: 16px; }
      .detail a { color: var(--accent); text-decoration: none; }

      .copyright { margin-top: 22px; font-size: 11.5px; color: var(--muted); }
    </style>
  </head>
  <body>
    <img class="icon" src="../assets/app-icon.png" alt="" />
    <div class="name" id="name">Agent Arcade Studio</div>
    <div class="ver" id="ver">Version</div>

    <div class="credits">
      <div class="sect">
        <div class="label">Languages</div>
        <div class="detail">JavaScript · Go</div>
      </div>
      <div class="sect">
        <div class="label">Runtime</div>
        <div class="detail">Electron · Chromium · Node.js</div>
      </div>
      <div class="sect">
        <div class="label">Terminal</div>
        <div class="detail">WezTerm — <a href="https://wezterm.org">wezterm.org</a></div>
      </div>
      <div class="sect">
        <div class="label">Libraries</div>
        <div class="detail">js-yaml</div>
        <div class="detail">electron-builder</div>
        <div class="detail">electron-reloader</div>
      </div>
    </div>

    <div class="copyright">© 2026 Talkersoft</div>

    <script>
      // Fill name + version from query params (?name=...&v=...). No tagline.
      const q = new URLSearchParams(location.search);
      if (q.get("name")) document.getElementById("name").textContent = q.get("name");
      document.getElementById("ver").textContent = "Version " + (q.get("v") || "");
    </script>
  </body>
</html>

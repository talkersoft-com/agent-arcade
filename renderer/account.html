<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Account</title>
<style>
  :root{
    --bg:#0e131a;--surface:#161d27;--surface2:#1d2530;--ink:#e7ecf3;--muted:#98a4b4;--faint:#6b7787;
    --border:#2a323e;--accent:#2dd4bf;--accent-ink:#052b27;--live:#34d399;--live-soft:#10331f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){:root{
    --bg:#f5f7fa;--surface:#fff;--surface2:#eef1f6;--ink:#18212f;--muted:#5a6676;--faint:#8b96a5;
    --border:#dfe4ec;--accent:#0d9488;--accent-ink:#fff;--live:#15a34a;--live-soft:#dcf5e5;
  }}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;user-select:none;-webkit-app-region:drag;
       display:grid;place-items:center}
  .card{width:100%;max-width:400px;padding:10px 26px 24px;-webkit-app-region:no-drag;text-align:center}
  .orb{width:50px;height:50px;border-radius:50%;margin:0 auto 16px;
       background:radial-gradient(circle at 35% 30%, var(--accent), transparent 70%),
                  conic-gradient(from 210deg, #2dd4bf, #0a63b0, #2dd4bf);
       box-shadow:0 0 28px -6px var(--accent)}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.55}

  .who{background:var(--surface);border:1px solid var(--border);border-radius:12px;
       padding:14px 16px;margin:0 0 18px;text-align:left}
  .who .em{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .pl{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px}
  .tier{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
        padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
  .tier.paid{background:var(--live-soft);color:var(--live)}

  button{font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;border-radius:10px;padding:11px 16px;
         width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  button.ghost{background:none;color:var(--muted);border-color:var(--border);font-weight:400;margin-top:9px}
  button.ghost:hover{color:var(--ink);border-color:var(--accent)}
  button.quiet{background:none;border-color:transparent;color:var(--faint);font-weight:400;font-size:12.5px;
               margin-top:6px;padding:7px}
  button.quiet:hover{color:var(--ink)}
  button:disabled{opacity:.55;cursor:default}

  .alt{margin-top:10px;display:none}
  .alt.on{display:block}
  .alt input{font:inherit;font-size:14px;width:100%;text-align:center;color:var(--ink);background:var(--bg);
             border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .alt input:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--faint);margin:13px 0 0;min-height:16px;line-height:1.5}
  .hint.err{color:#f87171}
</style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>

    <div class="who" id="who" style="display:none">
      <div class="em" id="email"></div>
      <div class="pl"><span class="tier" id="tier">free</span><span id="mode"></span></div>
    </div>

    <button id="primary">Continue with Google</button>

    <div class="alt" id="alt">
      <input id="hint" type="email" placeholder="you@example.com" autocomplete="email"
             spellcheck="false" autocapitalize="off" />
      <button id="hintgo">Continue</button>
    </div>

    <button class="ghost" id="secondary" style="display:none">Use a different account…</button>
    <button class="quiet" id="tertiary" style="display:none">Sign out</button>
    <button class="quiet" id="close">Close</button>
    <div class="hint" id="msg"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const reason = new URLSearchParams(location.search).get("reason") || "";
  let signedIn = false;

  const COPY = {
    expired:  ["Your session has expired", "Sign in again to keep your agents synced and cloud dictation working."],
    lapsed:   ["You’ve been signed out", "This can happen after a long gap, or if this device was released from your account."],
    license:  ["Your licence is no longer active", "Sign in again to check your plan. Agent Arcade keeps working locally either way."],
    firstrun: ["Sign in to Agent Arcade", "Your agents sync across machines, and dictation runs in the cloud."],
    "":       ["Account", "Manage the account this machine is signed in to."],
  };

  async function load() {
    const l = await window.tester.licenseGet();
    signedIn = !!(l && l.signedIn);
    const [t, s] = COPY[reason] || COPY[""];
    $("title").textContent = signedIn ? "Account" : t;
    $("sub").textContent = signedIn ? "" : s;

    if (signedIn) {
      $("who").style.display = "";
      $("email").textContent = l.email || "signed in";
      $("tier").textContent = l.label || "Free";
      $("tier").className = "tier" + (l.paid ? " paid" : "");
      $("mode").textContent = l.mode === "api" ? "synced" : "local only";
      $("primary").style.display = "none";
      $("secondary").style.display = "";
      $("secondary").textContent = "Sign in as someone else…";
      $("tertiary").style.display = "";
    } else {
      $("who").style.display = "none";
      $("primary").style.display = "";
      $("secondary").style.display = "";
      $("tertiary").style.display = "none";
    }
  }

  function busy(on, m, err) {
    for (const id of ["primary","secondary","tertiary","hintgo","close"]) $(id).disabled = on;
    $("msg").textContent = m || "";
    $("msg").className = "hint" + (err ? " err" : "");
  }

  async function signIn(hint) {
    busy(true, "Opening your browser — choose the account you want.");
    try {
      const r = await window.tester.authLogin(hint || undefined);
      if (r && r.ok) { window.tester.accountDone("signed-in"); return; }
      busy(false, (r && r.error) ? ("Sign-in didn’t complete: " + r.error) : "Sign-in didn’t complete.", true);
    } catch (e) {
      busy(false, "Sign-in failed: " + (e && e.message ? e.message : e), true);
    }
  }

  $("primary").addEventListener("click", () => signIn());
  $("secondary").addEventListener("click", () => {
    // Signed in → this IS the switch. Signed out → reveal the optional email box.
    if (signedIn) return signIn();
    $("alt").classList.toggle("on");
    if ($("alt").classList.contains("on")) $("hint").focus();
  });
  $("hintgo").addEventListener("click", () => signIn($("hint").value));
  $("hint").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); signIn($("hint").value); } });
  $("tertiary").addEventListener("click", async () => {
    busy(true, "Signing out…");
    await window.tester.authLogout();
    busy(false, "");
    await load();
  });
  $("close").addEventListener("click", () => window.tester.accountDone("closed"));

  load();
</script>
</body>
</html>

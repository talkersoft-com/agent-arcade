<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Arcade — carousel concept</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e6e9ef;
    font-family: -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .title { text-align: center; padding: 20px 0 4px; font-size: 13px; letter-spacing: 3px; opacity: 0.4; text-transform: uppercase; }

  /* The stage holds a vertical column of group rows. We translate the column so the
     selected group sits on the vertical centre line, and translate each row so its
     selected card sits on the horizontal centre line — that's the whole carousel. */
  #stage { flex: 1; position: relative; overflow: hidden; }
  #centerline { position: absolute; inset: 0; pointer-events: none; }
  #col { position: absolute; left: 0; right: 0; top: 50%; transition: transform .30s cubic-bezier(.22,.61,.36,1); }

  .grp { position: relative; height: 188px; transition: opacity .30s ease, filter .30s ease; }
  .grp-label { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .55; white-space: nowrap; }
  .grp.active .grp-label { color: #cfd6e2; opacity: .8; }
  .grp:not(.active) .grp-label { opacity: .35; }

  .track { position: absolute; top: 42px; left: 0; white-space: nowrap; height: 140px;
    transition: transform .30s cubic-bezier(.22,.61,.36,1); }
  /* one avatar card; fixed pitch so centring maths is exact */
  .card { display: inline-flex; flex-direction: column; align-items: center; gap: 12px;
    width: 140px; vertical-align: top; transition: transform .26s ease, opacity .26s ease; }
  .dot { width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 3px solid transparent; background: #161b26; box-shadow: 0 6px 30px rgba(0,0,0,0.4); position: relative; }
  .dot svg { width: 56px; height: 56px; transition: fill .3s ease; }
  .nm { font-size: 15px; font-weight: 700; text-align: center; max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 11px; opacity: 0.7; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.run { background: rgba(56,161,105,0.25); color: #54d98c; }
  .badge.stop { background: rgba(128,128,128,0.22); color: #aab; }

  /* ── the three visual tiers ───────────────────────────────────────────────
     1) selected card in the active group  → centred, largest, lit, colour halo
     2) other cards in the active group     → smaller, dimmer, still in colour
     3) every card in a non-active group    → grey silhouette, faded, shrunk
        (so you can see there's another group above / below without it competing) */
  .grp:not(.active) { opacity: .42; filter: grayscale(1); }
  .grp:not(.active) .card { transform: scale(.66); opacity: .7; }
  .grp:not(.active) .dot svg { fill: #6b7280 !important; }

  .grp.active .card { opacity: .5; transform: scale(.82); }
  .grp.active .card.sel { opacity: 1; transform: scale(1.18); }
  .grp.active .card.sel .dot { box-shadow: 0 0 0 4px rgba(255,255,255,0.12), 0 0 40px var(--c); }

  /* up / down affordance when groups exist off-centre */
  .chev { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; opacity: .25;
    pointer-events: none; transition: opacity .3s; }
  #chev-up { top: 8px; } #chev-dn { bottom: 96px; }
  .chev.hide { opacity: 0; }

  /* bottom strip (mirrors the real Arcade) */
  #strip { margin: 0 auto 14px; min-width: 60%; max-width: 90%; background: #11151f; border: 1px solid rgba(255,255,255,0.06);
    border-left: 5px solid var(--c, #444); border-radius: 14px; padding: 13px 22px; }
  #s-name { font-size: 15px; } #s-name b { font-weight: 800; }
  #s-meta { font-size: 12.5px; opacity: 0.65; margin-top: 4px; font-family: ui-monospace, Menlo, monospace; }
  #help { text-align: center; padding-bottom: 16px; font-size: 12.5px; opacity: 0.5; letter-spacing: .5px; }
  kbd { background: #1c2230; border: 1px solid rgba(255,255,255,0.12); border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: ui-monospace, monospace; }
  /* mode pill (prototype only) */
  #mode { position: fixed; top: 14px; right: 16px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    background: rgba(91,124,250,.16); color: #aebdff; border: 1px solid rgba(91,124,250,.4); border-radius: 999px; padding: 5px 12px; }
</style>
</head>
<body>
  <div class="title" id="title">Agent Arcade — Home (this Mac)</div>
  <div id="stage">
    <div id="chev-up" class="chev">▲</div>
    <div id="col"></div>
    <div id="chev-dn" class="chev">▼</div>
  </div>
  <div id="strip">
    <div id="s-name">—</div>
    <div id="s-meta"></div>
  </div>
  <div id="help">
    <kbd>←</kbd> <kbd>→</kbd> agent &nbsp;·&nbsp; <kbd>↑</kbd> <kbd>↓</kbd> group &nbsp;·&nbsp; <kbd>G</kbd> toggle flat / grouped (demo) &nbsp;·&nbsp; selected is always centred
  </div>
  <div id="mode">grouped</div>

<script>
const PERSON = '<svg viewBox="0 0 24 24" fill="var(--c)"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.6-9 6v2h18v-2c0-3.4-4-6-9-6z"/></svg>';
const PALETTE = ["#e6194B","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#469990"];

// ── mock data — two shapes to prove the SAME component handles both ──
const GROUPED = [
  { name: "Default",  agents: ["Cloud Manager","Voice Dictation","Planner / Advisor","Hive Deck"] },
  { name: "Research", agents: ["Paper Crawler","Synthesizer","Critic"] },
  { name: "Ops",      agents: ["Deploy Bot","Log Watcher"] },
];
const FLAT = [
  { name: "Default", agents: ["Cloud Manager","Voice Dictation","Planner / Advisor","Hive Deck"] },
];
let grouped = true;
let data = [];
let selG = 0, sel = 0;

const PITCH = 184;   // card width 140 + gap 44
const ROW   = 188;   // .grp height

const $ = (id) => document.getElementById(id);
const col = $("col");

function buildData() {
  const src = grouped ? GROUPED : FLAT;
  let ci = 0;
  data = src.map((g) => ({
    name: g.name,
    agents: g.agents.map((nm) => ({ name: nm, color: PALETTE[ci++ % PALETTE.length], running: Math.random() > 0.45 })),
  }));
}

function buildDOM() {
  col.innerHTML = data.map((g, gi) => {
    const cards = g.agents.map((a, i) =>
      `<div class="card" data-g="${gi}" data-i="${i}" style="--c:${a.color}">
        <div class="dot" style="--c:${a.color}">${PERSON}</div>
        <div class="nm">${a.name}</div>
        <div class="st"><span class="badge ${a.running ? "run" : "stop"}">${a.running ? "running" : "stopped"}</span></div>
      </div>`).join("");
    // grouped shows labels; flat (single group) hides the label for a clean single carousel
    const label = grouped ? `<div class="grp-label">${g.name}</div>` : "";
    return `<div class="grp" data-g="${gi}">${label}<div class="track" data-track="${gi}">${cards}</div></div>`;
  }).join("");
}

function render() {
  // clamp
  if (selG >= data.length) selG = data.length - 1; if (selG < 0) selG = 0;
  const len = data[selG].agents.length;
  if (sel >= len) sel = len - 1; if (sel < 0) sel = 0;

  const vw = window.innerWidth;
  // vertical: centre the selected group row on the stage centre line (#col top is 50%)
  col.style.transform = `translateY(${-(selG * ROW + ROW / 2)}px)`;

  data.forEach((g, gi) => {
    const grp = col.querySelector(`.grp[data-g="${gi}"]`);
    grp.classList.toggle("active", gi === selG);
    // horizontal: centre each row on its own column (active = sel; others = clamped sel)
    const colIdx = gi === selG ? sel : Math.min(sel, g.agents.length - 1);
    const track = grp.querySelector(".track");
    const cardCentre = colIdx * PITCH + 140 / 2;
    track.style.transform = `translateX(${vw / 2 - cardCentre}px)`;
    grp.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("sel", gi === selG && i === sel));
  });

  // chevrons + strip
  $("chev-up").classList.toggle("hide", !(grouped && selG > 0));
  $("chev-dn").classList.toggle("hide", !(grouped && selG < data.length - 1));
  const a = data[selG].agents[sel];
  $("strip").style.setProperty("--c", a.color);
  $("s-name").innerHTML = `<b>${a.name}</b>${grouped ? `  ·  <span style="opacity:.6">${data[selG].name}</span>` : ""}`;
  $("s-meta").textContent = `~/workspace  ·  ${a.running ? "running" : "stopped"}`;
  $("mode").textContent = grouped ? "grouped" : "flat";
}

function move(dG, dA) {
  if (dA) { const len = data[selG].agents.length; sel = (sel + dA + len) % len; }
  if (dG) {
    const ng = data.length, c = sel;
    selG = (selG + dG + ng) % ng;
    sel = Math.min(c, data[selG].agents.length - 1);
  }
  render();
}

document.addEventListener("keydown", (e) => {
  switch (e.key) {
    case "ArrowRight": e.preventDefault(); move(0, 1); break;
    case "ArrowLeft":  e.preventDefault(); move(0, -1); break;
    case "ArrowDown":  e.preventDefault(); move(1, 0); break;
    case "ArrowUp":    e.preventDefault(); move(-1, 0); break;
    case "g": case "G":
      grouped = !grouped; selG = 0; sel = 0; buildData(); buildDOM(); render(); break;
  }
});
window.addEventListener("resize", render);

buildData(); buildDOM(); render();
</script>
</body>
</html>
